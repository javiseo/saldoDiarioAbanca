name: Saldo diario
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
jobs:
  saldo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python saldo_diario.py
        env:
          ENABLE_APP_ID: ${{ secrets.ENABLE_APP_ID }}
          ENABLE_PRIVATE_KEY: ${{ secrets.ENABLE_PRIVATE_KEY }}
          ENABLE_SESSION_ID: ${{ secrets.ENABLE_SESSION_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
